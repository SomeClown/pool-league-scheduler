[pytest]
testpaths = tests
filterwarnings =
    error::sqlalchemy.exc.LegacyAPIWarning
    error::DeprecationWarning
    # Guards the identity-map fix in season_regenerate_partial (app/main/routes.py)
    # — the db.session.expunge() loop between the raw-SQL deletes and the new
    # inserts. Without it, SQLite's rowid recycling collides with stale
    # identity-map entries for the deleted tail rows and SQLAlchemy warns.
    # Targeted (not blanket error::SAWarning) so unrelated future SAWarnings
    # don't trip the suite. Exercised by
    # tests/test_regenerate.py::test_regenerate_partial_preserves_frozen_rounds_and_continues_alternation,
    # which reliably fires this warning 4x if the expunge loop is missing.
    error:Identity map already had an identity:sqlalchemy.exc.SAWarning
