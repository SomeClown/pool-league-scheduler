# REFERENCE TEMPLATE ONLY. The live droplet config at
# /etc/nginx/sites-available/pool-league is managed by certbot (it has
# added the SSL blocks and redirects itself); never copy this file over it.
# Diff by hand and apply changes deliberately, then `nginx -t` before reload.
#
# The app runs in a container publishing 127.0.0.1:8000, so the proxy_pass
# target is unchanged. /static/ used to be an `alias` to the checkout's
# files on disk. The droplet stays a git clone, so that alias would keep
# working, but it would serve whatever the checkout has, which can differ
# from the RUNNING IMAGE when the image TAG and the git checkout diverge
# (e.g. after a rollback by TAG). Proxying /static/ to the app keeps assets
# version-matched to the running image. The `expires 7d` header is added by
# nginx and keeps browser caching as before.

server {
    listen 80;
    server_name your-domain.com;  # replace with your domain or droplet IP

    # Redirect HTTP to HTTPS (uncomment after setting up SSL with certbot)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        expires 7d;
    }
}

